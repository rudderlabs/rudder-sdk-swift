# Run Swift Tests Workflow
#
# Triggered manually (workflow_dispatch) to run the full Swift test suite on demand.
#
# What it does:
#   1. Builds the package including test targets
#   2. Runs all unit tests sequentially (--no-parallel to avoid async race conditions)
#
# Permissions: contents:read only.

name: Run Swift Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Tests Sequentially
    runs-on: macos-latest
    timeout-minutes: 20
    
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Build
        run: swift build --build-tests

      - name: Run Tests (No Parallel)
        run: swift test --skip-build --no-parallel
        